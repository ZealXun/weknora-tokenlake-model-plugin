name: Plugin compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: xyz2781790037/WeKnora
          ref: feat/plugin-framework
          path: WeKnora
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - working-directory: WeKnora
        run: go run ./cmd/pluginctl compat --manifest ../plugin/plugin.yaml --weknora-version 0.2.0
